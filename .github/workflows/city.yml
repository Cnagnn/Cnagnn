name: Update Profile Visuals

on:
  schedule:
    # Every day at 07:17 WIB (UTC+7).
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/city.yml"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  update:
    name: Generate and publish profile visuals
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Cnagnn
          # Save the render locally; publish both images in our own commit below.
          output_action: none
          filename: profile-3d-city.svg
          base: ""
          base_skip: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Jakarta
          plugins_errors_fatal: yes

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install animation generator
        run: python -m pip install gh-space-shooter==2.0.5

      - name: Generate animation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh-space-shooter Cnagnn --output profile-space-shooter.gif --strategy random

      - name: Collect and validate images
        run: |
          cp /metrics_renders/profile-3d-city.svg profile-3d-city.svg
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          from PIL import Image

          root = ET.parse("profile-3d-city.svg").getroot()
          assert root.tag == "{http://www.w3.org/2000/svg}svg", "Invalid calendar SVG"
          assert Path("profile-3d-city.svg").stat().st_size > 0
          with Image.open("profile-space-shooter.gif") as image:
              assert image.format == "GIF", "Invalid space shooter GIF"
              image.verify()
          PY

      - name: Commit generated visuals as Cnagnn
        # Automation still runs through GitHub Actions; commit attribution uses
        # the repository owner's verified GitHub noreply identity.
        env:
          GIT_AUTHOR_NAME: Yoga Pratama Putra R
          GIT_AUTHOR_EMAIL: 164476047+Cnagnn@users.noreply.github.com
          GIT_COMMITTER_NAME: Yoga Pratama Putra R
          GIT_COMMITTER_EMAIL: 164476047+Cnagnn@users.noreply.github.com
        run: |
          git add -- profile-3d-city.svg profile-space-shooter.gif
          if git diff --staged --quiet; then
            echo "Profile visuals are already up to date."
            exit 0
          fi
          git commit -m "chore: automatically update profile visuals"
          git pull --rebase origin main
          git push origin HEAD:main
